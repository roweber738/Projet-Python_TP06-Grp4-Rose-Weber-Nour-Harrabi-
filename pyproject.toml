
[project]
name = "volspread"
version = "0.1.0"
description = "Are large stock price drops associated with stronger trading volume than equally large rises?"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "scipy==1.14.1",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "pyarrow==18.1.0",
    "jupyter==1.1.1",
    "ipykernel==6.29.5",
    "nbconvert==7.16.4",
    "pytest==8.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volspread"]
